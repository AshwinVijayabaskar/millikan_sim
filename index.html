<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Millikan Oil Drop Simulator</title>
<style>
body{
    font-family:Arial,sans-serif;
    display:flex;
    gap:20px;
    margin:20px;
}
#controls{
    width:300px;
}
label{
    display:block;
    margin-top:12px;
}
canvas{
    border:1px solid #333;
}
.value{
    font-weight:bold;
}
</style>
</head>
<body>

<div id="controls">
    <h2>Millikan Oil Drop Simulator</h2>

    <label>
        Electric Field (V/m)
        <input id="field" type="range"
               min="-500000" max="500000"
               step="1000" value="100000">
        <span id="fieldVal" class="value"></span>
    </label>

    <label>
        Radius (μm)
        <input id="radius" type="range"
               min="0.5" max="5"
               step="0.1" value="1.0">
        <span id="radiusVal" class="value"></span>
    </label>

    <label>
        Charge (e)
        <input id="charge" type="range"
               min="-20" max="20"
               step="1" value="5">
        <span id="chargeVal" class="value"></span>
    </label>

    <button id="reset">Reset Drop</button>

    <hr>

    <p><b>Forces</b></p>
    <div id="info"></div>
</div>

<canvas id="sim" width="500" height="600"></canvas>

<script>

const canvas = document.getElementById("sim");
const ctx = canvas.getContext("2d");

const g = 9.81;
const eta = 1.81e-5;
const rhoOil = 900;
const rhoAir = 1.2;
const eCharge = 1.602e-19;

let y;
let v;

const fieldSlider = document.getElementById("field");
const radiusSlider = document.getElementById("radius");
const chargeSlider = document.getElementById("charge");

function resetDrop(){
    y = canvas.height/2;
    v = 0;
}

resetDrop();

document.getElementById("reset").onclick = resetDrop;

function updateLabels(){
    fieldVal.textContent =
        Number(fieldSlider.value).toLocaleString();

    radiusVal.textContent =
        radiusSlider.value;

    chargeVal.textContent =
        chargeSlider.value;
}

function physics(dt){

    const E = Number(fieldSlider.value);
    const r = Number(radiusSlider.value) * 1e-6;
    const n = Number(chargeSlider.value);

    const q = n * eCharge;

    const volume = (4/3)*Math.PI*r*r*r;
    const mass = volume * rhoOil;

    const Fg = volume*rhoOil*g;
    const Fb = volume*rhoAir*g;
    const Fe = q*E;
    const Fd = 6*Math.PI*eta*r*v;

    const Fnet = Fe + Fb - Fg - Fd;

    const a = Fnet/mass;

    v += a*dt;

    y -= v*dt*1500;

    if(y < 30){
        y = 30;
        v = 0;
    }

    if(y > canvas.height-30){
        y = canvas.height-30;
        v = 0;
    }

    info.innerHTML =
        `
        Gravity: ${Fg.toExponential(3)} N<br>
        Buoyancy: ${Fb.toExponential(3)} N<br>
        Electric: ${Fe.toExponential(3)} N<br>
        Velocity: ${v.toExponential(3)} m/s
        `;
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#dddddd";
    ctx.fillRect(50,40,400,20);

    ctx.fillRect(50,540,400,20);

    ctx.fillStyle="gold";
    ctx.beginPath();
    ctx.arc(canvas.width/2,y,8,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#666";

    for(let i=0;i<10;i++){
        ctx.beginPath();
        ctx.moveTo(120+i*30,60);
        ctx.lineTo(120+i*30,100);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(120+i*30,500);
        ctx.lineTo(120+i*30,540);
        ctx.stroke();
    }

    ctx.fillStyle="black";
    ctx.fillText("Upper Plate",200,25);
    ctx.fillText("Lower Plate",200,585);
}

let lastTime = performance.now();

function animate(time){

    updateLabels();

    const dt = (time-lastTime)/1000;
    lastTime = time;

    physics(dt);
    draw();

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
